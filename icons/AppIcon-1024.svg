<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="b_bg" gradientUnits="userSpaceOnUse" x1="500" y1="30" x2="500" y2="970">
      <stop offset="0" stop-color="#fcd34d"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <mask id="b_wmask">
      <rect x="-500" y="-500" width="2000" height="2000" fill="white"/>
      <rect x="464" y="120" width="72" height="125" fill="black"/>
      <circle cx="500" cy="812" r="34" fill="black"/>
    </mask>
    <mask id="b_nuthole">
      <polygon points="665,540 582,683 418,683 335,540 418,397 582,397" fill="white"/>
      <polygon points="562,540 531,594 469,594 438,540 469,486 531,486" fill="black"/>
    </mask>
    <filter id="b_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#7c2d12" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="30" y="30" width="940" height="940" rx="210" fill="url(#b_bg)"/>
  <!-- crossed tools -->
  <g filter="url(#b_sh)" fill="#f8fafc">
    <g transform="rotate(-45 500 545)" mask="url(#b_wmask)">
      <rect x="472" y="250" width="56" height="560" rx="28"/>
      <circle cx="500" cy="240" r="80"/>
      <circle cx="500" cy="812" r="66"/>
    </g>
    <g transform="rotate(45 500 545)">
      <rect x="448" y="180" width="104" height="230" rx="52"/>
      <line x1="482" y1="218" x2="482" y2="374" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
      <line x1="500" y1="218" x2="500" y2="374" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
      <line x1="518" y1="218" x2="518" y2="374" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
      <rect x="482" y="405" width="36" height="26" fill="#94a3b8"/>
      <rect x="489" y="430" width="22" height="270" fill="#e2e8f0"/>
      <polygon points="489,700 511,700 506,754 494,754" fill="#e2e8f0"/>
    </g>
  </g>
  <!-- nut bug -->
  <g filter="url(#b_sh)">
    <g stroke="#1f2937" stroke-width="18" stroke-linecap="round" fill="none">
      <path d="M395,460 L300,400"/><path d="M380,545 L275,545"/><path d="M395,630 L305,690"/>
      <path d="M605,460 L700,400"/><path d="M620,545 L725,545"/><path d="M605,630 L695,690"/>
      <path d="M470,275 C465,240 450,225 428,218"/>
      <path d="M530,275 C535,240 550,225 572,218"/>
    </g>
    <circle cx="424" cy="215" r="9" fill="#1f2937"/><circle cx="576" cy="215" r="9" fill="#1f2937"/>
    <circle cx="500" cy="345" r="78" fill="#1f2937"/>
    <circle cx="474" cy="338" r="13" fill="#f8fafc"/><circle cx="526" cy="338" r="13" fill="#f8fafc"/>
    <circle cx="474" cy="338" r="6" fill="#1f2937"/><circle cx="526" cy="338" r="6" fill="#1f2937"/>
    <polygon points="665,540 582,683 418,683 335,540 418,397 582,397" fill="#1f2937"
             stroke="#475569" stroke-width="6" mask="url(#b_nuthole)"/>
  </g>
</svg>